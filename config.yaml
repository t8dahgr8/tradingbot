# Polymarket paper trader configuration.
# Every value here has a sane default in code; this file only overrides.

run:
  starting_cash: 100.0
  sports: [tennis]            # tennis | table_tennis
  live_only: true             # only trade matches actually in progress
  discovery_interval_s: 180
  mark_interval_s: 15
  status_interval_s: 60
  state_dir: state
  log_level: INFO
  max_runtime_s: 0            # 0 = run until Ctrl-C
  max_tracked_markets: 40

broker:
  # Round trip from decision to order resting on the book. Raise this if your
  # connection is slow -- it is the single most important realism knob.
  latency_ms: 250
  latency_jitter_ms: 100
  taker_fee_rate: 0.0         # Polymarket sports markets currently run fee-free
  maker_fee_rate: 0.0
  max_level_participation: 0.5
  miss_probability: 0.05
  passive_ttl_ms: 30000

risk:
  # Sizing. These are deliberately tight for a $100 bankroll.
  kelly_fraction: 0.20        # fraction of full Kelly
  max_position_pct: 0.10      # most of equity in one trade
  max_market_exposure_pct: 0.15
  max_total_exposure_pct: 0.60
  min_order_shares: 5         # Polymarket's own minimum
  max_order_shares: 500

  # Entry filters.
  min_edge: 0.03              # net of assumed slippage and fees
  min_confidence: 0.5
  max_spread: 0.05
  min_book_depth: 50
  max_book_age_ms: 5000
  min_price: 0.05             # stay out of the tails
  max_price: 0.95

  # Portfolio limits.
  max_concurrent_positions: 5
  max_positions_per_market: 1
  cooldown_ms: 20000

  # Kill switches. If any of these trip, trading stops for good.
  max_drawdown_pct: 0.25
  daily_loss_limit_pct: 0.15
  min_equity: 20.0

  assumed_slippage: 0.005

strategy:
  signal_ttl_ms: 45000        # how long after a score change an edge is real
  reanchor_halflife_s: 900    # pull the anchor toward the market over time
  max_games_at_anchor: 2      # refuse matches we did not see from the start
  anchor_min_price: 0.08
  anchor_max_price: 0.92
  take_profit_edge: 0.01
  stop_loss: 0.12
  hold_to_resolution: false
  surface: unknown            # hard | clay | grass | unknown
  model_weight: 0.75          # 1.0 = pure model, lower shrinks toward market
